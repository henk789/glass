[project]
name = "glass"
version = "0.1.0"
description = "GLASS: Global Latent Aggregation with Slot-based Set Decoding for Scalable All-Atom Crystal Generation"
license = "MIT"
authors = [
  { name = "Hendrik Kraß" },
  { name = "Seyed Mohamad Moosavi" },
  { name = "Mathias Niepert" },
]
requires-python = ">=3.11"
dependencies = [
  "ase>=3.23",
  "huggingface-hub>=0.30",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2",
  "pymatgen==2025.10.7",
  "pyyaml>=6",
  "scipy>=1.13",
  "torch==2.13.0",
  # The pinned QMOF150 release is a pickled PyTorch Geometric dataset.
  "torch-geometric>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glass", "eval", "toy"]
