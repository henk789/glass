# Quick functional check on MP20 (not a paper setting): tiny step counts.
data:
  dataset: mp20
  root: data/mp20
  workers: 8
autoencoder:
  model:
    nmax: 20
    dim: 256
    latent_dim: 16
    enc_depth: 4
    dec_depth: 6
    heads: 8
    slot_dim: 32
    coord_fourier_bands: 4
  loss:
    coord_weight: 4.0
    type_weight: 0.05
    lattice_weight: 5.0
    pair_distance_weight: 0.5
    pair_distance_inner: 3.0
    pair_distance_cutoff: 5.0
  train:
    steps: 300
    batch_size: 256
    lr: 0.0003
    warmup: 50
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-08
    seed: 0
    log_interval: 100
    checkpoint_interval: 300
flow:
  model:
    latent_dim: 16
    hidden: 768
    depth: 8
  train:
    steps: 300
    batch_size: 1024
    lr: 0.0003
    warmup: 50
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-08
    ema_decay: 0.9999
    seed: 0
    bf16: true
    encode_bf16: false
    encode_batch_size: 1024
    log_interval: 100
    checkpoint_interval: 300
sample:
  count: 64
  steps: 32
  seed: 4321
  batch_size: 512
